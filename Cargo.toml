[workspace]
name = "i3-instant-layout-rs"
version = "0.1.0"
edition = "2024"
resolver = "3"
members = ["core", "i3ipc-rs"]


[workspace.dependencies]
tempdir = "0.3.7"
anyhow = "1.0.102"
jiff = { version = "0.2.23", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"


[profile.release]
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"
